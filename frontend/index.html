<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#12b7f5">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AkariBot</title>
<style>
  :root{
    --qq-blue:#12b7f5; --qq-blue-d:#0a9fe0; --bg:#f2f3f5; --card:#ffffff;
    --line:#e6e8eb; --txt:#1f2329; --txt2:#8a9099; --self:#95ec69; --other:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#dfe1e5;color:var(--txt);
       display:flex;justify-content:center;min-height:100vh}
  .phone{width:100%;max-width:430px;background:var(--bg);height:100vh;display:flex;flex-direction:column;
         box-shadow:0 0 40px rgba(0,0,0,.12);position:relative;overflow:hidden}
  /* 顶栏 */
  .topbar{background:var(--qq-blue);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
          font-size:17px;font-weight:600;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .topbar .sub{font-size:12px;font-weight:400;opacity:.9}
  .topbar .botpick{background:rgba(255,255,255,.18);border-radius:6px;padding:4px 8px;font-size:12px;max-width:40%;
                   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 页面区 */
  .page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .hidden{display:none!important}
  /* 会话列表 */
  .conv{display:flex;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer}
  .conv:active{background:#f6f7f8}
  .avatar{width:44px;height:44px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;
          font-size:17px;font-weight:600;flex-shrink:0}
  .avatar.round{border-radius:50%}
  .conv .mid{flex:1;margin-left:12px;min-width:0}
  .conv .name{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .preview{font-size:13px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .conv .time{font-size:11px;color:var(--txt2);align-self:flex-start;margin-left:8px}
  .badge{background:#fa5151;color:#fff;font-size:11px;border-radius:9px;padding:1px 6px;margin-left:6px}
  /* 空态 */
  .empty{text-align:center;color:var(--txt2);font-size:14px;padding:60px 30px;line-height:1.9}
  /* 聊天页 */
  .chat-head{background:var(--qq-blue);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
  .chat-head .back{font-size:20px;line-height:1;cursor:pointer;width:24px}
  .chat-head .t{flex:1;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-body{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}
  .row{display:flex;margin-bottom:14px;align-items:flex-start;gap:8px}
  .row.me{flex-direction:row-reverse}
  .bubble{max-width:72%;padding:9px 12px;border-radius:10px;font-size:15px;line-height:1.45;background:var(--other);
          box-shadow:0 1px 2px rgba(0,0,0,.05);word-break:break-word}
  .row.me .bubble{background:var(--self)}
  .chat-input{display:flex;gap:8px;padding:10px 12px;background:#f7f8fa;border-top:1px solid var(--line);flex-shrink:0}
  .chat-input input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px;background:#fff;outline:none}
  .chat-input button{background:var(--qq-blue);color:#fff;border:none;border-radius:8px;padding:0 18px;font-size:15px;font-weight:500}
  .chat-input button:active{background:var(--qq-blue-d)}
  /* 底部 Tab */
  .tabs{display:flex;background:#f7f8fa;border-top:1px solid var(--line);flex-shrink:0}
  .tab{flex:1;text-align:center;padding:9px 0 11px;font-size:11px;color:var(--txt2);cursor:pointer;position:relative}
  .tab.on{color:var(--qq-blue)}
  .tab .ic{font-size:0;width:22px;height:22px;margin:0 auto 3px;display:block}
  .tab.on .ic{background:var(--qq-blue)}
  .tab .ic{background:var(--txt2);border-radius:6px}
  /* 卡片/表单 */
  .sec{padding:14px 16px}
  .sec h4{font-size:13px;color:var(--txt2);font-weight:500;margin:6px 0 10px}
  .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;font-size:14.5px;line-height:1.6}
  .botrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .botrow:last-child{border-bottom:none}
  .dot{width:8px;height:8px;border-radius:50%;background:#c8ccd1;flex-shrink:0}
  .dot.on{background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.18)}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;background:#eef1f4;color:var(--txt2);margin-left:auto}
  .pill.b{background:#e5f5fe;color:var(--qq-blue)}
  input.f,select.f{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14.5px;margin:5px 0;background:#fff;outline:none}
  .btn{width:100%;background:var(--qq-blue);color:#fff;border:none;border-radius:9px;padding:12px;font-size:15px;font-weight:600;margin-top:8px}
  .btn:active{background:var(--qq-blue-d)}
  .btn.ghost{background:#eef1f4;color:var(--txt)}
  .hint{font-size:12px;color:var(--txt2);line-height:1.6;margin-top:6px}
  .tag{display:inline-block;font-size:11px;background:#eef1f4;color:var(--txt2);border-radius:6px;padding:1px 7px;margin:2px 3px 0 0}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <span id="topTitle">消息</span>
    <span class="botpick" id="botPick" onclick="switchTab('me')">未连接账号</span>
  </div>

  <!-- 消息 -->
  <div class="page" id="page-msg">
    <div id="convList"></div>
  </div>

  <!-- 聊天 -->
  <div class="page hidden" id="page-chat" style="display:flex;flex-direction:column">
    <div class="chat-head">
      <span class="back" onclick="closeChat()">‹</span>
      <span class="t" id="chatTitle">会话</span>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input">
      <input id="chatText" placeholder="输入消息…" onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">发送</button>
    </div>
  </div>

  <!-- 插件 -->
  <div class="page hidden" id="page-plugin">
    <div class="sec">
      <h4>插件商店 · 输入 Git 仓库地址</h4>
      <div class="card">
        <input class="f" id="repoUrl" placeholder="https://github.com/user/repo">
        <div style="display:flex;gap:8px">
          <button class="btn ghost" style="flex:1" onclick="scanRepo()">扫描</button>
          <button class="btn" style="flex:1" onclick="installRepo()">安装全部</button>
        </div>
        <div class="hint" id="scanResult"></div>
      </div>
      <h4>已安装插件</h4>
      <div class="card" id="pluginList"></div>
    </div>
  </div>

  <!-- 我的 -->
  <div class="page hidden" id="page-me">
    <div class="sec">
      <h4>机器人账号</h4>
      <div class="card" id="botList"></div>
      <h4>添加账号</h4>
      <div class="card">
        <select class="f" id="newMode">
          <option value="onebot">个人号 · OneBot / NapCat（扫码登录）</option>
          <option value="qqofficial">官方号 · AppID + AppSecret</option>
        </select>
        <input class="f" id="newLabel" placeholder="备注名（如：小号 / 官方机器人）">
        <input class="f" id="newToken" placeholder="OneBot：连接 Token">
        <input class="f" id="newAppid" placeholder="官方：AppID" style="display:none">
        <input class="f" id="newSecret" placeholder="官方：AppSecret" style="display:none">
        <button class="btn" onclick="addBot()">添加</button>
        <div class="hint">个人号：需另装 NapCat，登录 QQ 后把「反向 WebSocket」指向 <b id="wsHint"></b></div>
      </div>
      <h4>服务器地址（打包成 App 后必填）</h4>
      <div class="card">
        <input class="f" id="srvUrl" placeholder="https://你的后端地址（留空=当前站点）">
        <button class="btn" onclick="saveSrv()">保存并重连</button>
        <div class="hint">装成 App 后，这里填你部署 AkariBot 后端的地址，App 就能连上。</div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" data-tab="msg" onclick="switchTab('msg')"><i class="ic"></i>消息</div>
    <div class="tab" data-tab="plugin" onclick="switchTab('plugin')"><i class="ic"></i>插件</div>
    <div class="tab" data-tab="me" onclick="switchTab('me')"><i class="ic"></i>我的</div>
  </div>
</div>

<script>
const PALETTE=["#12b7f5","#f5a623","#7ed321","#bd10e0","#4a90e2","#fa5151","#50e3c2","#8b572a"];
const $=id=>document.getElementById(id);
let bots=[], convs={}, cur=null, curTab="msg";

function colorOf(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
function initials(s){return (s||"?").slice(0,2)}
function avatar(name,round=true){return `<div class="avatar ${round?'round':''}" style="background:${colorOf(name||'?')}">${initials(name)}</div>`}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function now(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}

const SRV=()=>localStorage.getItem('akari_server')||'';
const apiUrl=p=>SRV().replace(/\/$/,'')+p;
function wsUrl(){const s=SRV();return s? s.replace(/^http/,'ws').replace(/\/$/,'')+'/ws' : `ws://${location.host}/ws`}
async function api(path,opt){const r=await fetch(apiUrl(path),opt);return r.json()}
function srvWsBase(){return (SRV()||('ws://'+location.host)).replace(/^http/,'ws').replace(/\/$/,'')}

// ---- 机器人 ----
async function loadBots(){
  bots=await api('/api/bots');
  $('botPick').textContent = bots.length? (bots.find(b=>b.status.connected)?.label||bots[0].label) : '未连接账号';
  $('botList').innerHTML = bots.length? bots.map(b=>`
    <div class="botrow">
      <span class="dot ${b.status.connected?'on':''}"></span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:500">${esc(b.label)}</div>
        <div style="font-size:12px;color:var(--txt2)">${b.mode==='onebot'?'个人号 OneBot':'官方号'} · ${b.status.connected?'在线':'离线'}</div>
      </div>
      ${b.status.connected
        ? `<button class="pill" onclick="botAction('${b.id}','stop')">停止</button>`
        : `<button class="pill b" onclick="botAction('${b.id}','start')">启动</button>`}
    </div>`).join('') : `<div class="empty">还没有账号，下面添加一个</div>`;
}
async function botAction(id,act){await api(`/api/bots/${id}/${act}`,{method:'POST'});setTimeout(loadBots,500)}
async function addBot(){
  const mode=$('newMode').value;
  const config = mode==='onebot'? {token:$('newToken').value} : {appid:$('newAppid').value,secret:$('newSecret').value};
  await api('/api/bots',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mode,label:$('newLabel').value||(mode==='onebot'?'个人号':'官方号'),config})});
  $('newLabel').value=$('newToken').value=$('newAppid').value=$('newSecret').value='';
  loadBots();
}
$('newMode')?.addEventListener('change',e=>{
  const q=e.target.value==='qqofficial';
  $('newAppid').style.display=q?'block':'none'; $('newSecret').style.display=q?'block':'none';
  $('newToken').style.display=q?'none':'block';
});

// ---- 会话 ----
function renderConvs(){
  const list=Object.values(convs).sort((a,b)=>b.ts-a.ts);
  $('convList').innerHTML = list.length? list.map(c=>`
    <div class="conv" onclick="openChat('${c.key}')">
      ${avatar(c.name)}
      <div class="mid"><div class="name">${esc(c.name)}</div><div class="preview">${esc(c.last)}</div></div>
      <div style="text-align:right"><div class="time">${c.time||''}</div>${c.unread?`<div class="badge">${c.unread}</div>`:''}</div>
    </div>`).join('') : `<div class="empty">暂无消息<br>收到消息后会出现在这里</div>`;
}
function openChat(key){
  const c=convs[key]; if(!c)return; cur=key; c.unread=0;
  $('page-chat').classList.remove('hidden'); $('page-msg').classList.add('hidden');
  $('topTitle').textContent='聊天'; $('chatTitle').textContent=c.name;
  renderChat(); renderConvs(); switchTabUI('chat');
}
function closeChat(){$('page-chat').classList.add('hidden');switchTab('msg')}
function renderChat(){
  const c=convs[cur]; if(!c)return;
  $('chatBody').innerHTML=c.msgs.map(m=>`<div class="row ${m.me?'me':''}">${avatar(m.me?'我':c.name)}<div class="bubble">${esc(m.text)}</div></div>`).join('');
  $('chatBody').scrollTop=$('chatBody').scrollHeight;
}
async function sendMsg(){
  const t=$('chatText').value.trim(); if(!t||!cur)return;
  const c=convs[cur]; c.msgs.push({text:t,me:true}); c.last=t; c.ts=Date.now(); c.time=now();
  $('chatText').value=''; renderChat();
  await api('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({bot_id:c.bot_id,scene:c.scene,peer_id:c.peer,text:t})});
  renderConvs();
}

// ---- 插件 ----
async function loadPlugins(){
  const d=await api('/api/plugins');
  $('pluginList').innerHTML = d.installed.length? d.installed.map(p=>`
    <div class="botrow"><div style="flex:1"><div style="font-weight:500">${esc(p.name)} <span style="color:var(--txt2);font-size:12px">v${esc(p.version)}</span></div>
    <div style="font-size:12px;color:var(--txt2)">${esc(p.description)}</div>
    <div>${(p.hooks||[]).map(h=>`<span class="tag">${esc(h)}</span>`).join('')}</div></div></div>`).join('')
    : `<div class="empty">还没有插件，上面装一个</div>`;
}
async function scanRepo(){
  const repo=$('repoUrl').value.trim(); if(!repo)return;
  $('scanResult').textContent='扫描中…';
  const d=await api('/api/plugins/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repo_url:repo})});
  $('scanResult').innerHTML = d.plugins? `发现 ${d.plugins.length} 个插件：<br>`+d.plugins.map(p=>`· ${esc(p.name)} v${esc(p.version||'?')} — ${esc(p.description||'')}`).join('<br>') : esc(JSON.stringify(d));
}
async function installRepo(){
  const repo=$('repoUrl').value.trim(); if(!repo)return;
  $('scanResult').textContent='安装中…';
  const d=await api('/api/plugins/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repo_url:repo})});
  $('scanResult').textContent = d.installed? ('已安装：'+d.installed.join('、')) : JSON.stringify(d);
  loadPlugins();
}

// ---- Tab ----
function switchTabUI(name){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===name))}
function switchTab(name){
  curTab=name;
  ['msg','plugin','me'].forEach(p=>$('page-'+p).classList.toggle('hidden',p!==name));
  $('page-chat').classList.add('hidden');
  $('topTitle').textContent={msg:'消息',plugin:'插件',me:'我的'}[name];
  switchTabUI(name);
  if(name==='plugin')loadPlugins(); if(name==='me')loadBots();
}

// ---- WebSocket ----
function connect(){
  const ws=new WebSocket(wsUrl());
  ws.onmessage=e=>{
    const ev=JSON.parse(e.data);
    if(ev.type==='message'){const d=ev.data;
      const key=`${d.bot_id}:${d.scene}:${d.peer_id}`;
      if(!convs[key])convs[key]={key,name:d.sender_name||d.peer_id,bot_id:d.bot_id,scene:d.scene,peer:d.peer_id,msgs:[],unread:0};
      convs[key].msgs.push({text:d.text,me:false});
      convs[key].last=d.text; convs[key].ts=Date.now(); convs[key].time=now();
      if(cur!==key)convs[key].unread++; else renderChat();
      renderConvs();
    }
    if(ev.type==='bot_status')loadBots();
  };
  ws.onclose=()=>setTimeout(connect,3000);
}

$('wsHint').textContent = srvWsBase()+'/onebot/v11/ws?bot=<账号id>';
function saveSrv(){localStorage.setItem('akari_server',$('srvUrl').value.trim());location.reload()}
$('srvUrl').value = localStorage.getItem('akari_server')||'';
loadBots(); loadPlugins(); renderConvs(); connect();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
